apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: minegenie
  namespace: flux-system
spec:
  dependsOn:
    - name: molt
    - name: gridtie
  interval: 10m
  path: ./apps/minegenie
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  wait: true
  timeout: 5m
