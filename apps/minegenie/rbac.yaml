apiVersion: v1
kind: ServiceAccount
metadata:
  name: minegenie
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: minegenie-smoke
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, get, list, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: minegenie-smoke
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: minegenie-smoke
subjects:
  - kind: ServiceAccount
    name: minegenie
