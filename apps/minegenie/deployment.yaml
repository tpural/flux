apiVersion: apps/v1
kind: Deployment
metadata:
  name: minegenie
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minegenie
  template:
    metadata:
      labels:
        app: minegenie
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minegenie
          image: ghcr.io/tpural/minegenie:0.5.0
          envFrom:
            - secretRef:
                name: minegenie
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/minegenie
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: minegenie-config
        - name: data
          persistentVolumeClaim:
            claimName: minegenie-data
