apiVersion: v1
kind: Service
metadata:
  name: minegenie
  annotations:
    # Players' games download the genie's resource pack from here.
    metallb.universe.tf/address-pool: homelab-pool
    external-dns.alpha.kubernetes.io/hostname: minegenie.lan.tapslab.com
spec:
  type: LoadBalancer
  selector:
    app: minegenie
  ports:
    - port: 80
      targetPort: http
      name: pack
    - port: 8080
      targetPort: http
      name: http
