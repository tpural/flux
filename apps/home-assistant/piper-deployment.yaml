apiVersion: apps/v1
kind: Deployment
metadata:
  name: piper
  namespace: home-assistant
  labels:
    app: piper
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: piper
  template:
    metadata:
      labels:
        app: piper
    spec:
      containers:
      - name: piper
        image: rhasspy/wyoming-piper:2.5.2
        args:
        - --voice
        - en_US-lessac-medium
        ports:
        - containerPort: 10200
          name: wyoming
        volumeMounts:
        - name: data
          mountPath: /data
      nodeSelector:
        kubernetes.io/arch: amd64
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: piper-data
