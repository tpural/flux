apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisper
  namespace: home-assistant
  labels:
    app: whisper
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: whisper
  template:
    metadata:
      labels:
        app: whisper
    spec:
      containers:
      - name: whisper
        image: rhasspy/wyoming-whisper:3.8.1
        args:
        - --model
        # tiny mishears short commands; base is still fast on CPU.
        - base-int8
        - --language
        - en
        ports:
        - containerPort: 10300
          name: wyoming
        volumeMounts:
        - name: data
          mountPath: /data
      nodeSelector:
        kubernetes.io/arch: amd64
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: whisper-data
