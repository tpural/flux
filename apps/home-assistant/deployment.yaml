apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-assistant
  labels:
    app: home-assistant
spec:
  replicas: 1
  # One instance at a time: two would share the SQLite database during a rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
    spec:
      containers:
      - name: home-assistant
        image: ghcr.io/home-assistant/home-assistant:2026.11.0
        ports:
        - containerPort: 8123
          name: http
        env:
        - name: TZ
          value: "America/Chicago"
        resources:
          requests: {cpu: 200m, memory: 512Mi}
        volumeMounts:
        - name: config
          mountPath: /config
      nodeSelector:
        kubernetes.io/arch: amd64
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: home-assistant-config
