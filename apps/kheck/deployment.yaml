apiVersion: apps/v1
kind: Deployment
metadata:
  name: kheck
  namespace: kheck
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: kheck}
  template:
    metadata:
      labels: {app: kheck}
    spec:
      serviceAccountName: kheck
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: kheck
          image: ghcr.io/tpural/kheck:0.2.0
          ports: [{name: http, containerPort: 8080}]
          # Each change's log record goes to tremolo too, through the cluster collector (it holds the ingest token).
          env:
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: http://tremolo-cluster.tremolo.svc:4318}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts: [{name: config, mountPath: /etc/kheck}]
      volumes:
        - name: config
          configMap: {name: kheck-config}
---
apiVersion: v1
kind: Service
metadata:
  name: kheck
  namespace: kheck
spec:
  selector: {app: kheck}
  ports: [{name: http, port: 8080, targetPort: http}]

