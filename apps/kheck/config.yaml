# kheck makes every change agents ask for. Keep protect.namespaces in step with
# kheck-protected-names in policy.yaml: the API server enforces it again.
tremolo:
  url: http://tremolo.tremolo.svc
settle: 90s
protect:
  namespaces:
    - kube-system
    - kube-public
    - kube-node-lease
    - flux-system
    - cert-manager
    - cilium-secrets
    - metallb-system
    - istio-system
    - gpu-operator
    - nfs-provisioner
    - postgres
    - cloudflare-operator
    - cloudflare-operator-system
    - external-dns
    - possum
    - tremolo
    - upkeeper
    - kheck
# POSSUM powers gpu01 down: that's not a node down or cordoned.
asleepTaints: [possum.dev/asleep]
gates:
  - name: one node at a time
    actions: [cordon]
    require: {controlPlane: false, otherNodesReady: true, maxCordoned: 0}
  - name: replicas
    actions: [scale]
    require: {minReplicas: 1, maxReplicas: 10}
