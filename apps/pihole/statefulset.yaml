apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pihole
  namespace: pihole
  labels:
    app: pihole
spec:
  serviceName: pihole-headless
  replicas: 1
  selector:
    matchLabels:
      app: pihole
  template:
    metadata:
      labels:
        app: pihole
    spec:
      securityContext:
        fsGroup: 1000
      containers:
      - name: pihole
        image: pihole/pihole:2026.06.0
        ports:
        - name: dns-udp
          containerPort: 53
          protocol: UDP
        - name: dns-tcp
          containerPort: 53
          protocol: TCP
        - name: http
          containerPort: 80
          protocol: TCP
        env:
        - name: FTLCONF_webserver_api_password
          valueFrom:
            secretKeyRef:
              name: pihole-secret
              key: FTLCONF_webserver_api_password
        - name: API_TOKEN
          valueFrom:
            secretKeyRef:
              name: pihole-secret
              key: API_TOKEN
        # The query log is SQLite with a WAL; over NFS a NAS stall crashes FTL (SIGBUS).
        - name: FTLCONF_files_database
          value: /var/lib/pihole-db/pihole-FTL.db
        envFrom:
        - configMapRef:
            name: pihole-config
        volumeMounts:
        - name: pihole-data
          mountPath: /etc/pihole
        - name: pihole-data
          mountPath: /etc/dnsmasq.d
        - name: var-log
          mountPath: /var/log
        - name: run-log
          mountPath: /run/log
        - name: query-db
          mountPath: /var/lib/pihole-db
        resources:
          requests:
            memory: "512Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          exec:
            command: [dig, +short, +time=2, +tries=1, "@127.0.0.1", pi.hole]
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /admin/
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
            - SYS_NICE
      volumes:
      - name: var-log
        emptyDir: {}
      - name: run-log
        emptyDir: {}
      - name: query-db
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: pihole-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 4Gi
