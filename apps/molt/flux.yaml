apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: molt
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/molt
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 15m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
