apiVersion: v1
kind: ServiceAccount
metadata:
  name: molt
---
# molt starts and stops its backends: one Pod per generation.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: molt
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: molt
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: molt
subjects:
  - kind: ServiceAccount
    name: molt
