apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gpu-operator
  namespace: gpu-operator
spec:
  interval: 30m
  chart:
    spec:
      chart: gpu-operator
      version: "v26.7.2"
      sourceRef:
        kind: HelmRepository
        name: nvidia
        namespace: gpu-operator
      interval: 12h
  values:
    operator:
      defaultRuntime: containerd
    driver:
      # Host driver: Canonical-signed linux-modules-nvidia-595-server-open (Secure Boot on gpu01)
      enabled: false
    toolkit:
      enabled: true
    devicePlugin:
      enabled: true
    dcgmExporter:
      enabled: false
    migManager:
      enabled: false
    nodeStatusExporter:
      enabled: false
    gfd:
      enabled: true
