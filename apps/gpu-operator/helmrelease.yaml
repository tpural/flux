apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gpu-operator
  namespace: gpu-operator
spec:
  interval: 30m
  # A suspended gpu01 keeps its Node, so its GPU pods are never ready while it sleeps.
  install:
    disableWait: true
  upgrade:
    disableWait: true
  chart:
    spec:
      chart: gpu-operator
      version: "v26.7.2"
      sourceRef:
        kind: HelmRepository
        name: nvidia
        namespace: gpu-operator
      interval: 12h
  values:
    operator:
      defaultRuntime: containerd
    driver:
      # Host driver: Canonical-signed linux-modules-nvidia-595-server-open (Secure Boot on gpu01)
      enabled: false
    toolkit:
      enabled: true
    devicePlugin:
      enabled: true
    dcgmExporter:
      enabled: false
    migManager:
      enabled: false
    nodeStatusExporter:
      enabled: false
    gfd:
      enabled: true
    node-feature-discovery:
      worker:
        # Pis can't hold an NVIDIA GPU and have no DMI table: there NFD only logs DMI errors.
        nodeSelector:
          kubernetes.io/arch: amd64
