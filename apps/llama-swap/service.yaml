apiVersion: v1
kind: Service
metadata:
  name: llama-swap
  namespace: llama-swap
  annotations:
    metallb.universe.tf/address-pool: homelab-pool
    external-dns.alpha.kubernetes.io/hostname: llm.lan.tapslab.com
spec:
  type: LoadBalancer
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: llama-swap
