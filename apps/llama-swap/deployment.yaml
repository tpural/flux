apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-swap
  namespace: llama-swap
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llama-swap
  template:
    metadata:
      labels:
        app: llama-swap
    spec:
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: llama-swap
          image: ghcr.io/mostlygeek/llama-swap:v264-cuda-b11580
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: models
              mountPath: /models
              readOnly: true
          resources:
            requests:
              cpu: "4"
              memory: "24Gi"
            limits:
              nvidia.com/gpu: 1
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: llama-swap-config
        - name: models
          hostPath:
            path: /opt/llm/models
            type: Directory
