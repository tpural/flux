# upkeeper only looks. Its changes are made by kheck (apps/kheck), which checks each against its gates
# and records it in tremolo. Nothing on secrets or configmaps, and no RBAC rights.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: upkeeper
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: upkeeper
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, events, nodes, namespaces, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: upkeeper
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: upkeeper
subjects:
  - kind: ServiceAccount
    name: upkeeper
    namespace: upkeeper
