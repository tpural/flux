apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: upkeeper
  namespace: flux-system
spec:
  dependsOn:
    - name: tremolo
  interval: 10m
  path: ./apps/upkeeper
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  wait: true
  timeout: 5m
