apiVersion: apps/v1
kind: Deployment
metadata:
  name: upkeeper
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: upkeeper
  template:
    metadata:
      labels:
        app: upkeeper
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: upkeeper
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: upkeeper
          image: ghcr.io/tpural/upkeeper:0.1.0
          envFrom:
            - secretRef:
                name: upkeeper-tremolo
          ports:
            - containerPort: 9090
              name: admin
          readinessProbe:
            httpGet:
              path: /healthz
              port: admin
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/upkeeper
      volumes:
        - name: config
          configMap:
            name: upkeeper-config
