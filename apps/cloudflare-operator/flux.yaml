apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: cloudflare-operator
  namespace: flux-system
spec:
  interval: 1h
  ref:
    tag: v0.13.1
  url: https://github.com/adyanth/cloudflare-operator
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudflare-operator-crds
  namespace: flux-system
spec:
  interval: 10m
  path: ./config/crd
  prune: true
  sourceRef:
    kind: GitRepository
    name: cloudflare-operator
    namespace: flux-system
  timeout: 2m
  # Upstream's config/crd leaves kustomize placeholders that config/default fills in. Without
  # these, the two Kustomizations keep overwriting each other's CRDs.
  patches:
    - target:
        kind: CustomResourceDefinition
        group: apiextensions.k8s.io
      patch: |
        - op: add
          path: /metadata/annotations/cert-manager.io~1inject-ca-from
          value: cloudflare-operator-system/cloudflare-operator-serving-cert
        # Removing a CRD deletes every tunnel; never let a prune do that.
        - op: add
          path: /metadata/annotations/kustomize.toolkit.fluxcd.io~1prune
          value: disabled
    - target:
        kind: CustomResourceDefinition
        name: clustertunnels.networking.cfargotunnel.com
      patch: |
        - op: replace
          path: /spec/conversion/webhook/clientConfig/service
          value:
            name: cloudflare-operator-webhook-service
            namespace: cloudflare-operator-system
            path: /convert
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudflare-operator
  namespace: flux-system
spec:
  dependsOn:
    - name: cloudflare-operator-crds
  interval: 10m
  path: ./apps/cloudflare-operator
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  timeout: 5m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
