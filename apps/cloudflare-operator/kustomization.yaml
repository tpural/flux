apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - secret.yaml
  - https://github.com/adyanth/cloudflare-operator/config/default?ref=v0.13.1
patches:
  # The cloudflare-operator-crds Kustomization owns the CRDs; two owners keep rewriting them.
  - target:
      kind: CustomResourceDefinition
    patch: |
      $patch: delete
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: any
