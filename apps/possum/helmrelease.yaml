apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: possum
  namespace: flux-system
spec:
  type: oci
  interval: 10m
  url: oci://ghcr.io/tpural/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: possum
  namespace: flux-system
spec:
  interval: 10m
  releaseName: possum
  targetNamespace: possum
  # A suspended gpu01 keeps its Node, so its agent pod is never ready while it sleeps.
  install:
    disableWait: true
  upgrade:
    disableWait: true
  chart:
    spec:
      chart: possum
      version: "0.5.0"
      sourceRef:
        kind: HelmRepository
        name: possum
        namespace: flux-system
  # The chart has no pod annotations yet; let tremolo scrape the provider's metrics.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: possum
            patch: |
              - op: add
                path: /spec/template/metadata/annotations/prometheus.io~1scrape
                value: "true"
              - op: add
                path: /spec/template/metadata/annotations/prometheus.io~1port
                value: "8080"
  values:
    config:
      dryRun: false
      nodeGroups:
        - name: pi-workers
          minSize: 1
          maxSize: 6
          driver:
            name: unifi
            config:
              url: https://10.1.1.180
              site: default
              insecureSkipVerify: true
          labels:
            possum.dev/group: pi-workers
          nodes:
            - {name: pi-943f260c, target: "74:ac:b9:55:27:a0/1", mac: "dc:a6:32:da:73:be"}
            - {name: pi-eb4b1d2f, target: "74:ac:b9:55:27:a0/2", mac: "dc:a6:32:d9:b9:11"}
            - {name: pi-a72d0218, target: "74:ac:b9:55:27:a0/4", mac: "dc:a6:32:da:74:09"}
            - {name: pi-fd8e980f, target: "74:ac:b9:55:27:a0/5", mac: "dc:a6:32:da:6d:85"}
            - {name: pi-80438b1b, target: "74:ac:b9:55:27:a0/6", mac: "dc:a6:32:d9:bf:a4"}
            - {name: pi-b9483b5b, target: "74:ac:b9:55:27:a0/7", mac: "dc:a6:32:da:73:af"}
        - name: gpu
          minSize: 0
          maxSize: 1
          dryRun: false
          suspend: true
          scaleDownUnneededTime: 15m
          timeouts:
            boot: 3m
            powerSettle: 1m
          driver:
            name: wol
            config:
              broadcast: 10.1.51.255:9
          labels:
            possum.dev/group: gpu
          taints:
            - {key: nvidia.com/gpu, value: present, effect: NoSchedule}
          template:
            cpu: "24"
            memory: 31Gi
            resources:
              nvidia.com/gpu: "1"
            labels:
              kubernetes.io/arch: amd64
              nvidia.com/gpu.product: NVIDIA-GeForce-RTX-3090
          nodes:
            - {name: gpu01, target: "d8:43:ae:24:7c:8a@10.1.51.10", mac: "d8:43:ae:24:7c:8a"}
    provider:
      hostNetwork: true
    credentials:
      existingSecret: possum-unifi
    autoscaler:
      args:
        scale-down-unneeded-time: 10m
        scale-down-delay-after-add: 10m
        max-node-provision-time: 10m
        max-scale-down-parallelism: "1"
        expander: least-waste
        skip-nodes-with-local-storage: "false"
        v: "2"
    httpRoute:
      enabled: true
      annotations:
        external-dns.alpha.kubernetes.io/hostname: possum.lan.tapslab.com
      hostnames:
        - possum.lan.tapslab.com
      parentRefs:
        - name: default-gateway
          namespace: istio-system
          sectionName: https
