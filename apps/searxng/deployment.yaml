apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
spec:
  replicas: 1
  selector:
    matchLabels: {app: searxng}
  template:
    metadata:
      labels: {app: searxng}
    spec:
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: searxng
          image: searxng/searxng:2026.10.27-b5ed73fcb
          env:
            - name: SEARXNG_SECRET
              valueFrom: {secretKeyRef: {name: searxng, key: secret}}
          ports:
            - {containerPort: 8080, name: http}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 30
          resources:
            requests: {cpu: 20m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: settings, mountPath: /etc/searxng/settings.yml, subPath: settings.yml}
            - {name: cache, mountPath: /var/cache/searxng}
      volumes:
        - name: settings
          configMap: {name: searxng-settings}
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: searxng
spec:
  ports:
    - {port: 8080, targetPort: http, name: http}
  selector: {app: searxng}
