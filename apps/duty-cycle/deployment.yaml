apiVersion: apps/v1
kind: Deployment
metadata:
  name: duty-cycle
  namespace: duty-cycle
spec:
  # Two, unlike WIL. This serves a static bundle and holds no per-client state
  # at all — the game is entirely client-side and telemetry is fire-and-forget —
  # so a second replica is free rolling-update headroom rather than a
  # correctness problem.
  replicas: 2
  selector:
    matchLabels:
      app: duty-cycle
  template:
    metadata:
      labels:
        app: duty-cycle
    spec:
      serviceAccountName: duty-cycle
      securityContext:
        runAsNonRoot: true
        # nginx-unprivileged's USER is 101. Stated explicitly because kubelet
        # cannot resolve an image's user NAME to a UID before start, and with
        # runAsNonRoot alone it refuses to start rather than risk root.
        runAsUser: 101
      containers:
        - name: duty-cycle
          image: ghcr.io/tpural/duty-cycle:0.6.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            # Matches the ingest and the tunnel, which already had it. nginx
            # needs exactly two writable paths: its proxy/client temp area, and
            # /tmp where the unprivileged image keeps its pid file. Both are
            # emptyDir — nothing here is worth persisting across a restart.
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            # subPath so only config.js is replaced — mounting the directory
            # would hide index.html and the hashed assets beside it.
            - name: config
              mountPath: /usr/share/nginx/html/config.js
              subPath: config.js
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: duty-cycle-config
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
