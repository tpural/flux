apiVersion: v1
kind: ConfigMap
metadata:
  name: openwebui-config
  namespace: openwebui
data:
  .env: |
    ENABLE_PERSISTENT_CONFIG=False
    ENABLE_OLLAMA_API=false
    OPENAI_API_BASE_URL=http://llama-swap.llama-swap.svc.cluster.local:8080/v1
    OPENAI_API_KEY=none
    ENABLE_LOCAL_MODEL_DOWNLOAD=false
    ENABLE_LOCAL_MODEL_UPLOAD=false
    ENABLE_SIGNUP=true
    DEFAULT_USER_ROLE=user
    ENABLE_COMMUNITY_SHARING=false
    ENABLE_MESSAGE_RATING=true
    ENABLE_MODEL_FILTER=true
    ENABLE_ADMIN_EXPORT=true
    ENABLE_ADMIN_CHAT_ACCESS=true
    ENABLE_ADMIN_USER_MANAGEMENT=true
    ENABLE_OPENAI_API=true
    ENABLE_OPENAI_API_BASE_URL=http://llama-swap.llama-swap.svc.cluster.local:8080/v1
    ENABLE_OPENAI_API_KEY=none
    WEBUI_AUTH=true
    ENABLE_LIGHT_MODE=true
    ENABLE_CHAT_HISTORY=true
    ENABLE_MODEL_FILTER=true
    ENABLE_ADMIN_CHAT_ACCESS=true
