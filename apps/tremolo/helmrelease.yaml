apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: tremolo
  namespace: flux-system
spec:
  type: oci
  interval: 10m
  url: oci://ghcr.io/tpural/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tremolo
  namespace: flux-system
spec:
  interval: 10m
  releaseName: tremolo
  targetNamespace: tremolo
  # The collector pod on a suspended gpu01 is never ready while it sleeps.
  install:
    disableWait: true
  upgrade:
    disableWait: true
  chart:
    spec:
      chart: tremolo
      version: "0.22.0"
      sourceRef:
        kind: HelmRepository
        name: tremolo
        namespace: flux-system
  # The collector's ingest token, kept out of this file.
  valuesFrom:
    - kind: Secret
      name: tremolo-collector-token
      valuesKey: token
      targetPath: kubernetes.tremolo.token
  values:
    ingest:
      existingSecret: tremolo-ingest
    alerts:
      envFromSecret: tremolo-alerts-env
      config:
        timezone: America/Chicago
        url: https://tremolo.lan.tapslab.com
        notify:
          page: phone
          warn: phone
        channels:
          phone:
            type: homeassistant
            url: http://home-assistant-lb.home-assistant.svc
            service: mobile_app_tims_iphone
            token: ${HA_TOKEN}
    providers:
      kubernetes:
        asleepTaints: [possum.dev/asleep]
      possum:
        enabled: true
    hostLookback: 2160h
    nodeSelector:
      kubernetes.io/arch: amd64
    httpRoute:
      enabled: true
      annotations:
        external-dns.alpha.kubernetes.io/hostname: tremolo.lan.tapslab.com
      hostnames:
        - tremolo.lan.tapslab.com
      parentRefs:
        - name: default-gateway
          namespace: istio-system
          sectionName: https
    metrics:
      server:
        retentionPeriod: 90d
        nodeSelector:
          kubernetes.io/arch: amd64
    logs:
      server:
        retentionPeriod: 30d
        # Safety net against a log flood filling the volume before 30 days.
        retentionDiskSpaceUsage: 15
        nodeSelector:
          kubernetes.io/arch: amd64
    traces:
      enabled: true
      server:
        retentionPeriod: 14d
        retentionDiskSpaceUsage: 8
        nodeSelector:
          kubernetes.io/arch: amd64
    kubernetes:
      clusterName: homelab
      cluster:
        nodeSelector:
          kubernetes.io/arch: amd64
